name: grand-line-akinator

x-backend-env: &backend-env
  FUSEKI_URL: http://fuseki:3030
  FUSEKI_USER: admin
  FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:?set FUSEKI_PASSWORD in .env}
  TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
  TOGETHER_MODEL: ${TOGETHER_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash}
  TOGETHER_BASE_URL: ${TOGETHER_BASE_URL:-https://api.together.xyz/v1}

services:
  fuseki:
    image: secoresearch/fuseki:5.1.0      # multi-arch (native on Apple silicon)
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:?set FUSEKI_PASSWORD in .env}
    ports: ["${FUSEKI_PORT:-3030}:3030"]
    volumes:
      - ./fuseki/shiro.ini:/jena-fuseki/shiro.ini:ro
      - ./fuseki/assembler.ttl:/fuseki-base/configuration/assembler.ttl:ro
      - fuseki_data:/fuseki-base/databases
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ingestion:                       # one-shot: RDF -> OWL RL -> Fuseki (idempotent)
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.ingestion"]
    environment: *backend-env
    depends_on: { fuseki: { condition: service_healthy } }
    restart: "no"

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      <<: *backend-env
      FEEDBACK_DIR: /data/player-feedback
    volumes:
      - ./work/player-feedback:/data/player-feedback
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      fuseki: { condition: service_healthy }
      ingestion: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  frontend:
    build: { context: frontend }
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on: { backend: { condition: service_healthy } }

volumes:
  fuseki_data:
