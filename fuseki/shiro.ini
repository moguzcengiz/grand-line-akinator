[main]
ssl.enabled = false
plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
# the container entrypoint replaces this line with ADMIN_PASSWORD
admin=pw

[roles]

[urls]
/$/status = anon
/$/ping   = anon
/$/** = authcBasic,user[admin]
# reads (SPARQL query) are open, writing the store needs the admin password
/ds/data = authcBasic,user[admin]
/ds/data/** = authcBasic,user[admin]
/** = anon
